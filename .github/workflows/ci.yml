# Every push to dev and every pull request (dev → main): build, typecheck, tests, the install scripts, and the
# contract smoke test against a live OpenClaw Gateway. The release workflow runs the same checks again on main
# before it builds the installers.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # One OpenClaw version everywhere (deploy/openclaw.version and its copies).
      - run: node scripts/openclaw-version.mjs check
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Bridge modules and scripts (Linux)
        run: node --test deploy/*.test.mjs scripts/*.test.mjs
      - name: Install scripts
        run: shellcheck -S warning deploy/install.sh deploy/scripts/*.sh

  # The RPCs ClawDesk relies on, against the real Gateway of the pinned OpenClaw (deploy/scripts/contract.sh).
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/scripts/contract.sh

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # tauri-build needs the launcher's dist and the bundled server code to exist.
      - run: pnpm --filter @clawdesk/desktop build && pnpm --filter @clawdesk/desktop bundle-source
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
