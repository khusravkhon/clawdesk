[package]
name = "clawdesk-desktop"
version = "0.1.0"
description = "ClawDesk desktop: servers, install over SSH, the panel in a window"
edition = "2021"
license = "MIT"

[lib]
name = "clawdesk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
anyhow = "1.0.104"
flate2 = "1"
getrandom = "0.3"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-notification = "2.6.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.3"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
