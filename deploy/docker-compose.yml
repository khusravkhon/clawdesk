# ClawDesk: OpenClaw Gateway + panel (BFF serving the web UI).
#
# The panel shares the gateway's network namespace, so it reaches the Gateway on
# 127.0.0.1:18789 (silent local device pairing) while the Gateway itself never
# listens outside loopback. Only the panel port is published.
#
# Junior agents run in Docker sandboxes started by the Gateway through the host
# Docker socket. Sandbox containers are siblings on the host, so OpenClaw state
# lives at the SAME absolute path on the host and inside the Gateway
# (CLAWDESK_DATA_DIR, default /var/lib/clawdesk): workspace paths in its config
# must resolve for both.
#
# Security: access to the Docker socket is root-equivalent on the host. Only the
# Gateway gets it; agent sandboxes never do.
#
# First start: deploy/scripts/init.sh (creates .env, onboards OpenClaw, starts the stack).

name: clawdesk

x-hardening: &hardening
  cap_drop: [NET_RAW, NET_ADMIN]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped

services:
  gateway:
    <<: *hardening
    # Pinned: upgrading OpenClaw is a separate, tested change (see docs/architecture.md, decision 5).
    # OPENCLAW_IMAGE=openclaw/openclaw selects the official Docker Hub mirror of the same release.
    build:
      context: .
      dockerfile: gateway.Dockerfile
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw}
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-2026.8.1}
    image: clawdesk-gateway:${OPENCLAW_VERSION:-2026.8.1}
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: ${CLAWDESK_DATA_DIR:-/var/lib/clawdesk}/openclaw
      OPENCLAW_CONFIG_PATH: ${CLAWDESK_DATA_DIR:-/var/lib/clawdesk}/openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: ${CLAWDESK_DATA_DIR:-/var/lib/clawdesk}/openclaw
      OPENCLAW_WORKSPACE_DIR: ${CLAWDESK_DATA_DIR:-/var/lib/clawdesk}/openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?run deploy/scripts/init.sh to create .env}
      OPENCLAW_DISABLE_BONJOUR: "1"
      # 2026.8.1 retries a slow first Gemini 3 Flash answer with thinking level MINIMAL, which newer
      # Flash models (gemini-3.7-flash) reject with 400 — the turn then fails. Wait for the answer instead.
      OPENCLAW_GOOGLE_GEMINI_FIRST_RESPONSE_RETRY_MS: "0"
      TZ: ${CLAWDESK_TZ:-UTC}
    volumes:
      - ${CLAWDESK_DATA_DIR:-/var/lib/clawdesk}/openclaw:${CLAWDESK_DATA_DIR:-/var/lib/clawdesk}/openclaw
      - openclaw-auth-secrets:/home/node/.config/openclaw
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared folder from the person's computer: files/ in the main agent's workspace.
      - ${CLAWDESK_FILES_DIR:-./files}:${CLAWDESK_DATA_DIR:-/var/lib/clawdesk}/openclaw/workspace/files
    # Group owning the Docker socket on the host (detected by init.sh; 0 on Docker Desktop).
    group_add:
      - "${DOCKER_GID:-999}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/index.js", "gateway", "--bind", "${GATEWAY_BIND:-loopback}", "--port", "18789"]
    ports:
      # Published here because the panel lives in this network namespace.
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  panel:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/panel.Dockerfile
    image: ghcr.io/khusravkhon/clawdesk-panel:${CLAWDESK_VERSION:-dev}
    network_mode: "service:gateway"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      GATEWAY_URL: ws://127.0.0.1:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      DATA_DIR: /data
      WEB_DIST: /app/web
      LOG_LEVEL: ${PANEL_LOG_LEVEL:-info}
      CLAWDESK_SANDBOX: ${CLAWDESK_SANDBOX:-on}
      FREELLMAPI_URL: http://127.0.0.1:3001
      FILES_DIR: /files
      FILES_HOST_PATH: ${CLAWDESK_FILES_DIR:-./files}
    volumes:
      - panel-data:/data
      # Read-only, only to list what the agent can see.
      - ${CLAWDESK_FILES_DIR:-./files}:/files:ro
    depends_on:
      gateway:
        condition: service_healthy

  # Optional "free models" for junior agents (personal mode only): FreeLLMAPI pools
  # providers' free tiers behind one OpenAI-compatible endpoint. It shares the
  # gateway's network namespace and listens on loopback only; the panel manages
  # its account and keys, OpenClaw reaches it as provider "freellmapi".
  freellmapi:
    <<: *hardening
    image: ghcr.io/tashfeenahmed/freellmapi:${FREELLMAPI_VERSION:-v0.13.7}
    network_mode: "service:gateway"
    environment:
      NODE_ENV: production
      HOST: ${FREELLMAPI_HOST:-127.0.0.1}
      PORT: "3001"
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:?run deploy/scripts/init.sh to create .env}
    volumes:
      - freellmapi-data:/app/server/data
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  freellmapi-data:
  openclaw-auth-secrets:
  panel-data:
